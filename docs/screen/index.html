<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond™ TV business screen</title>
<meta name="description" content="Turn this TV into a shop window screen. It shows a code: type it into Beyond™ Spaces and put your specials, menu or adverts on it from anywhere.">
<link rel="icon" href="../assets/favicon-64.png">
<!-- The business screen player. Opened in any TV's web browser, or by Beyond™ TV's Business screen mode.
     Plain ES5 and CSS without variables or grid, because a 2015 TV's browser has to run it all day.
     It talks to Beyond™ Spaces with a secret only this TV holds; nothing else is stored here. -->
<style>
  @font-face { font-family: 'Sora'; src: url('../assets/fonts/SoraVariable.ttf') format('truetype'); font-weight: 100 800; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c18; color: #f7f6f2; cursor: none;
               font-family: 'Sora', system-ui, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #stage.portrait { -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  .slide { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0;
           -webkit-transition: opacity 0.8s ease; transition: opacity 0.8s ease; }
  .slide.on { opacity: 1; }
  .slide img, .slide video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .slide iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  /* The welcome and the code, in Beyond(TM) TV's own look. */
  #card { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; text-align: center;
          background: #0d0c18; background: -webkit-linear-gradient(135deg, #0d0c18, #2c2458);
          background: linear-gradient(135deg, #0d0c18, #2c2458); }
  #card.show { display: block; }
  #card .inner { position: absolute; left: 0; right: 0; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); padding: 0 6vw; }
  .dots { display: inline-block; width: 7vh; height: 7vh; margin-bottom: 3vh; }
  .dots i { float: left; width: 3vh; height: 3vh; border-radius: 50%; margin: 0 0.5vh 0.5vh 0; }
  h1 { font-size: 5.5vh; font-weight: 700; margin: 0 0 2vh; }
  p { font-size: 3vh; line-height: 1.5; color: #c9c3e6; margin: 0 0 2vh; }
  #code { display: inline-block; font-size: 15vh; font-weight: 700; letter-spacing: 2vh; color: #fff; margin: 2vh 0 3vh;
          padding: 2vh 4vh 2vh 6vh; border-radius: 3vh; background: rgba(110, 61, 219, 0.35); border: 0.6vh solid #9e7bff;
          -webkit-animation: breathe 4s ease-in-out infinite; animation: breathe 4s ease-in-out infinite; }
  @-webkit-keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.82; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.82; } }
  b { color: #fff; }
  .small { font-size: 2.2vh; color: #8f88b4; }
  #note { position: absolute; right: 2vh; bottom: 2vh; font-size: 1.8vh; color: rgba(255, 255, 255, 0.6);
          background: rgba(0, 0, 0, 0.45); padding: 0.6vh 1.4vh; border-radius: 1vh; display: none; }
  #note.show { display: block; }
  @media (prefers-reduced-motion: reduce) {
    #code { -webkit-animation: none; animation: none; }
    .slide { -webkit-transition: none; transition: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="card"><div class="inner">
  <span class="dots"><i style="background:#2f7d6d"></i><i style="background:#e8a33d"></i><i style="background:#d85a30"></i><i style="background:#378add"></i></span>
  <h1 id="title">Beyond™ TV business screen</h1>
  <div id="body"><p>Getting ready...</p></div>
</div></div>
<div id="note"></div>
<script>
(function () {
  'use strict';

  // Where Beyond(TM) Spaces answers. ?api= is for trying a test server.
  var API = (function () {
    var m = /[?&]api=([^&]+)/.exec(location.search);
    return m ? decodeURIComponent(m[1]).replace(/\/+$/, '') : 'https://beyondfamily.app/api/spaces/v1';
  })();
  var STORE = 'beyond.screen.';
  var SYNC_EVERY = 20000;     // seconds between asks once it has a playlist
  var WAIT_EVERY = 4000;      // while a code is on screen, so it changes the moment somebody types it
  var LINK_KEEP = 6 * 3600000; // the same link for a file for six hours, so the TV is not fetching it twice
  var stage = document.getElementById('stage');
  var card = document.getElementById('card');
  var title = document.getElementById('title');
  var body = document.getElementById('body');
  var note = document.getElementById('note');

  function get(k) { try { return localStorage.getItem(STORE + k); } catch (e) { return null; } }
  function put(k, v) { try { if (v === null) localStorage.removeItem(STORE + k); else localStorage.setItem(STORE + k, v); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function request(method, path, token, done) {
    var x = new XMLHttpRequest();
    x.open(method, API + path, true);
    x.timeout = 15000;
    if (token) x.setRequestHeader('Authorization', 'Bearer ' + token);
    if (method === 'POST') x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function () {
      var data = null;
      try { data = JSON.parse(x.responseText); } catch (e) {}
      done(x.status, data);
    };
    x.onerror = x.ontimeout = function () { done(0, null); };
    x.send(method === 'POST' ? JSON.stringify({ device: deviceName() }) : null);
  }

  // A short, readable name for this TV, so the business can tell its screens apart.
  function deviceName() {
    var ua = navigator.userAgent || '';
    if (/Web0S|webOS/i.test(ua)) return 'LG TV';
    if (/Tizen/i.test(ua)) return 'Samsung TV';
    if (/BeyondTV/i.test(ua)) return 'Beyond TV';
    if (/AFT|Silk/i.test(ua)) return 'Fire TV';
    if (/Android/i.test(ua)) return 'Android TV';
    if (/CrOS/.test(ua)) return 'Chromebox';
    if (/Windows/.test(ua)) return 'Windows PC';
    if (/Macintosh/.test(ua)) return 'Mac';
    if (/Linux/.test(ua)) return 'Linux';
    return 'Web browser';
  }

  function showCard(heading, html) {
    title.innerHTML = esc(heading);
    body.innerHTML = html;
    card.className = 'show';
  }
  function hideCard() { card.className = ''; }
  function setNote(text) { note.innerHTML = esc(text || ''); note.className = text ? 'show' : ''; }

  // Pairing ---------------------------------------------------------------

  var token = get('token');
  var timer = null;
  var helloWait = 2000;

  function hello() {
    request('POST', '/screens/hello', null, function (status, data) {
      if (status === 201 && data && data.token) {
        token = data.token;
        put('token', token);
        helloWait = 2000;
        showCode(data.code);
        later(WAIT_EVERY);
        return;
      }
      showCard('Beyond™ TV business screen', '<p>Can\'t reach Beyond™ right now. Check this TV is on the internet. Trying again...</p>');
      helloWait = Math.min(helloWait * 2, 60000);
      clearTimeout(timer);
      timer = setTimeout(hello, helloWait);
    });
  }

  function showCode(code) {
    var spaced = code ? code.substr(0, 3) + ' ' + code.substr(3) : '';
    showCard('Make this TV your shop window', '<p>On your phone or computer, open <b>beyondspaces.nz/app/screens</b>,<br>press <b>Add a screen</b> and type</p>' +
      '<div id="code">' + esc(spaced) + '</div>' +
      '<p class="small">A new code comes up every 30 minutes until it\'s added.</p>');
  }

  function later(ms) { clearTimeout(timer); timer = setTimeout(sync, ms); }

  // Asking what to play ----------------------------------------------------

  var current = null; // the last answer, also kept for when the internet drops

  function sync() {
    if (!token) return hello();
    request('GET', '/screens/sync', token, function (status, data) {
      if (status === 404) {
        // Removed from the business, or never added: start again with a new code.
        token = null;
        put('token', null);
        put('last', null);
        stop();
        return hello();
      }
      if (status !== 200 || !data) {
        // Offline or a hiccup: keep showing what it had.
        if (!current) {
          var saved = null;
          try { saved = JSON.parse(get('last') || 'null'); } catch (e) {}
          if (saved) apply(saved); else showCard('Beyond™ TV business screen', '<p>Can\'t reach Beyond™ right now. Trying again...</p>');
        }
        setNote(current ? 'Offline. Showing the last playlist.' : '');
        return later(SYNC_EVERY);
      }
      setNote('');
      if (!data.paired) {
        showCode(data.code);
        return later(WAIT_EVERY);
      }
      put('last', JSON.stringify(data));
      apply(data);
      later(SYNC_EVERY);
    });
  }

  // Playing -----------------------------------------------------------------

  var links = {};   // media id -> { url, at }
  var playing = []; // the playlist as it is being played
  var index = -1;
  var shown = null; // the slide on screen
  var next = null;  // the timer to the next slide
  var signature = '';

  function linkFor(item) {
    if (item.kind === 'web') return item.url;
    var now = +new Date();
    var had = links[item.id];
    if (had && now - had.at < LINK_KEEP) return had.url;
    links[item.id] = { url: item.url, at: now };
    return item.url;
  }

  function apply(data) {
    current = data;
    orient(data.orientation);
    var items = data.items || [];
    if (!items.length) {
      stop();
      showCard(data.business || 'Your screen', '<p>This is <b>' + esc(data.name || 'your screen') + '</b>.</p>' +
        '<p>Nothing to show yet. Add pictures, videos or web pages in Beyond™ Spaces, under Screens.</p>');
      return;
    }
    hideCard();
    var sig = JSON.stringify(items.map(function (i) { return [i.id, i.kind, i.seconds, i.url ? i.url.split('?')[0] : '']; }));
    if (sig === signature && playing.length) return; // nothing changed: carry on where it is
    signature = sig;
    playing = items;
    // Something changed: show it now rather than at the end of what is on.
    index = -1;
    advance();
  }

  function stop() {
    clearTimeout(next);
    playing = [];
    signature = '';
    index = -1;
    if (shown) { stage.removeChild(shown); shown = null; }
  }

  function advance() {
    clearTimeout(next);
    if (!playing.length) return;
    index = (index + 1) % playing.length;
    var item = playing[index];
    var slide = document.createElement('div');
    slide.className = 'slide';
    var el;
    var done = false;
    function move(delay) {
      if (done) return;
      done = true;
      clearTimeout(next);
      next = setTimeout(advance, delay);
    }
    if (item.kind === 'image') {
      el = document.createElement('img');
      el.onerror = function () { move(2000); };
      el.src = linkFor(item);
      move(item.seconds * 1000);
    } else if (item.kind === 'video') {
      el = document.createElement('video');
      el.muted = true;
      el.setAttribute('muted', '');
      el.setAttribute('playsinline', '');
      el.autoplay = true;
      el.preload = 'auto';
      // A video plays to the end. On its own in a playlist it simply loops.
      if (playing.length === 1) el.loop = true;
      el.onended = function () { move(0); };
      el.onerror = function () { move(2000); };
      el.src = linkFor(item);
      var p = el.play && el.play();
      if (p && p.catch) p.catch(function () {});
      // In case a TV never says it ended.
      next = setTimeout(function () { if (playing.length > 1) move(0); }, 15 * 60000);
    } else {
      el = document.createElement('iframe');
      el.setAttribute('scrolling', 'no');
      el.setAttribute('allow', 'autoplay');
      el.src = linkFor(item);
      move(item.seconds * 1000);
    }
    slide.appendChild(el);
    stage.appendChild(slide);
    var before = shown;
    shown = slide;
    // Fade the new one in over the old, then take the old one away.
    setTimeout(function () { slide.className = 'slide on'; }, 30);
    if (before) setTimeout(function () { if (before.parentNode) before.parentNode.removeChild(before); }, 900);
    preloadAfter();
  }

  function preloadAfter() {
    if (playing.length < 2) return;
    var n = playing[(index + 1) % playing.length];
    if (n && n.kind === 'image') { var i = new Image(); i.src = linkFor(n); }
  }

  // A TV turned on its side: draw the page turned a quarter so it reads the right way up.
  function orient(o) {
    var w = window.innerWidth, h = window.innerHeight;
    if (o === 'portrait' && w > h) {
      stage.className = 'portrait';
      stage.style.width = h + 'px';
      stage.style.height = w + 'px';
      var t = 'translateX(' + w + 'px) rotate(90deg)';
      stage.style.webkitTransform = t;
      stage.style.transform = t;
    } else {
      stage.className = '';
      stage.style.width = stage.style.height = '100%';
      stage.style.webkitTransform = stage.style.transform = '';
    }
  }
  window.onresize = function () { if (current) orient(current.orientation); };

  // Staying on ----------------------------------------------------------------

  // Full screen on the first press of the remote or a click, where the browser allows it.
  function fullScreen() {
    var d = document.documentElement;
    var f = d.requestFullscreen || d.webkitRequestFullscreen;
    if (f && !(document.fullscreenElement || document.webkitFullscreenElement)) { try { f.call(d); } catch (e) {} }
  }
  document.addEventListener('keydown', fullScreen);
  document.addEventListener('click', fullScreen);

  // Keep the screen awake where the browser can.
  function wake() {
    if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').then(null, function () {});
  }
  wake();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });

  // A fresh start every night around 4am, so a page that runs for months never slows down.
  setInterval(function () {
    var d = new Date();
    if (d.getHours() === 4 && d.getMinutes() < 5 && +d - started > 3600000) location.reload();
  }, 60000);
  var started = +new Date();

  sync();
})();
</script>
</body>
</html>
